<div class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">European Freight &amp; Logistics</p>
    <h1>Sign in</h1>
    <p class="muted">Your fleet, your loads — one place.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="driver@example.com"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">Password is required.</small>
        }
      </label>

      @if (error(); as message) {
        <p class="alert alert-error">{{ message }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </section>
</div>
