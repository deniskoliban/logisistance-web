<div class="auth-shell">
  <section class="auth-card auth-card-wide">
    <p class="eyebrow">European Freight &amp; Logistics</p>
    <h1>Create your account</h1>
    <p class="muted">Start with your driver profile — you can add vehicles next.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <div class="grid-2">
        <label class="field">
          <span>Full name</span>
          <input type="text" formControlName="full_name" autocomplete="name" placeholder="Jan Kowalski" />
          @if (form.controls.full_name.touched && form.controls.full_name.invalid) {
            <small class="field-error">Enter your full name.</small>
          }
        </label>

        <label class="field">
          <span>Age</span>
          <input type="number" formControlName="age" min="18" max="100" placeholder="34" />
          @if (form.controls.age.touched && form.controls.age.invalid) {
            <small class="field-error">Drivers must be between 18 and 100.</small>
          }
        </label>
      </div>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="driver@example.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">Use at least 8 characters.</small>
        }
      </label>

      <div class="grid-2">
        <label class="field">
          <span>Country</span>
          <select formControlName="country">
            <option value="" disabled>Select country</option>
            @for (country of countries(); track country.code) {
              <option [value]="country.code">{{ country.name }}</option>
            }
          </select>
          @if (form.controls.country.touched && form.controls.country.invalid) {
            <small class="field-error">Select your country.</small>
          }
        </label>

        <label class="field">
          <span>City</span>
          <input type="text" formControlName="city" autocomplete="address-level2" placeholder="Warsaw" />
          @if (form.controls.city.touched && form.controls.city.invalid) {
            <small class="field-error">Enter your city.</small>
          }
        </label>
      </div>

      @if (error(); as message) {
        <p class="alert alert-error">{{ message }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">
      Already registered? <a routerLink="/login">Sign in</a>
    </p>
  </section>
</div>
