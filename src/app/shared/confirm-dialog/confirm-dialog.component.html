<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" *transloco="let t">
  <button mat-button type="button" [mat-dialog-close]="false">{{ t('actions.cancel') }}</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmLabel ?? t('actions.save') }}
  </button>
</mat-dialog-actions>
