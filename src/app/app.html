@if (isAuthenticated()) {
  <header class="topbar">
    <a class="brand" routerLink="/vehicles">
      <span class="brand-mark">EFL</span>
      <span class="brand-text">
        <strong>Freight Assistant</strong>
        <small>European road transport</small>
      </span>
    </a>

    <nav class="nav">
      <a routerLink="/vehicles" routerLinkActive="active">Fleet</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
    </nav>

    <div class="topbar-user">
      @if (user(); as current) {
        <span class="topbar-name">{{ current.full_name }}</span>
      }
      <button type="button" class="btn btn-ghost btn-small" (click)="logout()">Sign out</button>
    </div>
  </header>
}

<main class="main">
  <router-outlet />
</main>
